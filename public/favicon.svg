<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0f0f13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="50%" stop-color="#F5B700"/>
      <stop offset="100%" stop-color="#D99B00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Neumorphic rounded base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Pure "S" lettermark -->
  <text x="64" y="90" font-family="'Funnel Display', 'Poppins', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" filter="url(#softShadow)">S</text>
</svg>
